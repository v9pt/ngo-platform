name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ngo_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5433/ngo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: System libraries for PDF rendering
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-core
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  e2e:
    # The real flows in a real browser, against a production build, the real API and Postgres.
    # Pinned: Playwright does not support chromium on the ubuntu-latest image (26.04) yet.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ngo
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5433/ngo
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System libraries for PDF rendering
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-core
      - name: Start the API on seeded data
        working-directory: backend
        run: |
          pip install -r requirements.txt
          # Throwaway values for this job only.
          {
            echo "JWT_SECRET=$(python -c 'import secrets;print(secrets.token_urlsafe(48))')"
            echo "GATEWAY_WEBHOOK_SECRET=$(python -c 'import secrets;print(secrets.token_urlsafe(48))')"
            echo "PAN_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())')"
          } > ci.env
          set -a; . ./ci.env; set +a
          alembic upgrade head
          python -m app.seed
          nohup uvicorn app.main:create_app --factory --port 8000 > api.log 2>&1 &
          timeout 60 sh -c 'until curl -sf localhost:8000/ready; do sleep 1; done'
      - name: Build and start the site
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm run start > web.log 2>&1 &
          timeout 60 sh -c 'until curl -sf -o /dev/null localhost:3000; do sleep 1; done'
      - name: Browser tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image (proves pango and fonts install)
        run: docker build -t ngo-api backend
