[project]
name = "ngo-platform-api"
version = "0.1.0"
description = "Donation platform and women's schemes finder: API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented pattern

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501", "S608"]  # asserts and fake secrets are fine in tests
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
